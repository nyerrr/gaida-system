services:
  - type: web
    name: gaida-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STUDENT_ACCOUNTS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      # Chat model configuration. These must match what gpt_agent.py reads.
      # A fine-tuned OpenAI model uses LLM_MODEL=<ft:...> with OPENAI_API_KEY
      # above and no LLM_BASE_URL. An open-weight / hosted model (Qwen LoRA,
      # vLLM, Ollama, Groq, OpenRouter, …) uses LLM_API_KEY (or HF_TOKEN) + LLM_BASE_URL +
      # LLM_MODEL instead. Managed in the Render dashboard, not here, because
      # they are account-specific and a blueprint `value` would overwrite them
      # on every sync.
      - key: HF_TOKEN
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_REASONING_EFFORT
        sync: false
      # Optional automatic fallback used when the fine-tuned host is down.
      - key: LLM_FALLBACK_BASE_URL
        sync: false
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODEL
        sync: false
      # Kept for the OpenAI fine-tuning scripts and hosted STT/TTS fallbacks.
      - key: OPENAI_MODEL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: CAPTCHA_SECRET
        generateValue: true
      - key: PARTICIPANT_TOKEN_SECRET
        generateValue: true
      # Counselor ID/password logins. Without COUNSELOR_ACCOUNTS the deployed
      # service has no password counselors and /api/auth/counselor-login
      # returns 401. Set it in the Render dashboard (or sync this blueprint and
      # enter the value when prompted) as a JSON list, for example:
      #   [{"id":"COUNSELOR01","password":"<long-random>",
      #     "name":"Dr. Jane Cruz","email":"jane.cruz@ue.edu.ph"}]
      # COUNSELOR_EMAILS is the comma-separated allow-list for Google sign-in
      # counselor accounts.
      # For a temporary pilot-only fallback, add GAIDA_ALLOW_DEMO_COUNSELORS=1
      # instead; that enables the public demo passwords and must not be used
      # for real participant data.
      - key: COUNSELOR_ACCOUNTS
        sync: false
      - key: COUNSELOR_EMAILS
        sync: false
      - key: WHISPER_MODEL
        value: medium
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: COUNSELOR_ALERT_EMAILS
        sync: false
      - key: ESCALATION_EMAILS
        sync: false
      - key: FRONTEND_URL
        value: https://gaida-system.vercel.app
