services:
  - type: web
    name: gaida-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # The app exposes GET/HEAD /health (backend/app/main.py) — there is no /healthz.
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CAPTCHA_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: COUNSELOR_ALERT_EMAILS
        sync: false
      - key: FRONTEND_URL
        sync: false