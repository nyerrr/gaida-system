<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GAIDA</title>

    <!-- ─── Favicons (updated GAIDA design) ─────────────────── -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- ─── PWA ──────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Matches the "Sky" palette's page background in StudentDashboard.jsx /
      ResearchFlow.jsx / ResearchSUS.jsx. This was #7c6af7 (lavender), which
      matched neither the app nor its own icons — the installed PWA showed a
      purple status bar over a cool-blue app. Keep in sync with
      public/manifest.json, which declares the same pair.
    -->
    <meta name="theme-color" content="#F7FAF9" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GAIDA" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <!-- ─────────────────────────────────────────────────── -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
